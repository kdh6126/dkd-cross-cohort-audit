   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 6.6px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #c1440e" x="64.395697" y="116.286504" transform="rotate(-0 64.395697 116.286504)">CASES</text>
