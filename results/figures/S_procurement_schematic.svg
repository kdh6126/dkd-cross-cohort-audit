   <g id="text_27">
    <text style="font-size: 6.3px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; fill: #1a1a1a" transform="translate(179.929848 235.160207)">Replacing the control with a biopsy of a different kidney disease removes</text>
    <text style="font-size: 6.3px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; fill: #1a1a1a" transform="translate(179.929848 244.620051)">the handling difference, and the module effect goes with it. What survives</text>
    <text style="font-size: 6.3px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; fill: #1a1a1a" transform="translate(179.929848 254.079894)">that substitution is the part of the signal that is about the disease.</text>
   </g>
  </g>
  <g id="text_28">
   <text style="font-size: 5.8px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #8a8a8a" x="1.86" y="278.175281" transform="rotate(-0 1.86 278.175281)">Draft schematic. Anatomy is not to scale; the effect sizes are read from the KPMP single-nucleus analysis.</text>
  </g>
 </g>
