   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 6.6px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #2a5d8f" x="113.567288" y="116.286504" transform="rotate(-0 113.567288 116.286504)">CONTROLS</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6.3px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #2a5d8f" x="113.567288" y="129.071606" transform="rotate(-0 113.567288 129.071606)">nephrectomy / donor</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; fill: #8a8a8a" transform="translate(26.658041 150.01931)">kidney in situ and perfused;</text>
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; fill: #8a8a8a" transform="translate(32.869666 159.625617)">a 1-2 mm core is taken</text>
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; fill: #8a8a8a" transform="translate(31.479025 168.672954)">and fixed at the bedside</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; fill: #8a8a8a" transform="translate(80.82935 149.981529)">organ already removed;</text>
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; fill: #8a8a8a" transform="translate(76.869585 159.000288)">normal-appearing cortex is</text>
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; fill: #8a8a8a" transform="translate(73.775882 168.056829)">cut away from the tumour (T)</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.3px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; fill: #1a1a1a" transform="translate(-5.046951 186.281567)">The two routes differ in how long the tissue is without circulation and</text>
    <text style="font-size: 6.3px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; fill: #1a1a1a" transform="translate(-8.423357 195.743379)">in how it is handled before fixation. Immediate-early genes (FOS, JUN,</text>
    <text style="font-size: 6.3px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; fill: #1a1a1a" transform="translate(-3.00831 205.201254)">EGR1 and the rest of the 19-gene module) respond to exactly that.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #1a1a1a" x="88.981492" y="238.45905" transform="rotate(-0 88.981492 238.45905)">In every public DKD cohort, cases are biopsies and controls are not.</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #8a8a8a" x="88.981492" y="252.60813" transform="rotate(-0 88.981492 252.60813)">The module separates the two routes in 8 of 9 kidney datasets.</text>
   </g>
